# standard config for all my home assistant devices.

network:
  #enable_ipv6: true
  #min_ipv6_addr_count: 2
  #enable_high_performance: true

api:
  # reboot_timeout set to 0s will keep the board running even when networking (connection to the home asst api)
  # is lost, even if lost forever. A non-zero timeout will cause the board to reboot if it can't connect to the API within the specified time, 
  # which is the most useful option for our purposes.
  # reboot_timeout: 0s
  # password is deprecated in favor of encryption key
  encryption:
     key: !secret api_encryption_key
  on_client_connected:
    - logger.log:
        format: "Client %s connected to API with IP %s"
        args: ["client_info.c_str()", "client_address.c_str()"]     

ota:
  - platform: esphome
    password: !secret ota_password
      
web_server:
  port: 80
  version: 3
  include_internal: true
  log: true
  local: true

time:
  - platform: homeassistant
    id: esptime

