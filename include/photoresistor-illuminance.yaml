sensor:
  - platform: adc
    # this needs to be an analog input pin
    pin: ${illuminance_pin}
    name: "Photoresistor 0"
    id: illuminance_id
    state_class: measurement
    device_class: illuminance
    accuracy_decimals: 1
    # why centivolts? I want a 3-digit number
    unit_of_measurement: cV
    attenuation: auto
    #raw: true
    update_interval: 10s
    filters:
      - multiply: 100
      - delta: 10.0
      - clamp:
          min_value: 0
          max_value: 300
          ignore_out_of_range: true