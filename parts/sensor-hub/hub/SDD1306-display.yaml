substitutions:
  source_env_sensor_hostname: no_host_specified_in_config
  
# The sensors we declare here get their values from Home Assistant via the API; 
# They can be used in the display lambda to show data from other devices.
sensor:
  - platform: homeassistant
    name: Humidity (${source_env_sensor_hostname})
    id: humidity_id
    entity_id: sensor.${source_env_sensor_hostname}_humidity
    # attribute:
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
  - platform: homeassistant
    name: "Air Temperature (${source_env_sensor_hostname})"
    id: temperature_id
    entity_id: sensor.${source_env_sensor_hostname}_air_temperature_bmp280
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°F"
  - platform: homeassistant
    name: "Air Pressure (${source_env_sensor_hostname})"
    id: pressure_id
    entity_id: sensor.${source_env_sensor_hostname}_air_pressure
    device_class: atmospheric_pressure
    state_class: measurement
    unit_of_measurement: "inHg"
  - platform: homeassistant
    name: "Photoresistor (${source_env_sensor_hostname})"
    id: illuminance_id
    entity_id: sensor.${source_env_sensor_hostname}_photoresistor_0
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: "cV"

font:
  - file: "/workspace/res/fonts/spleen-5x8.bdf"
    id: tiny_font_id
  - file: "/workspace/res/fonts/Bahnschrift/bahnschrift.condensedsemibold.ttf"
    id: large_font_id
    size: 48
  - file: "/workspace/res/fonts/Bahnschrift/bahnschrift.condensedsemibold.ttf"
    id: small_font_id
    size: 36
  - file: "/workspace/res/fonts/Bahnschrift/bahnschrift.condensedsemibold.ttf"
    id: med_font_id
    size: 28

display:
  - platform: ssd1306_i2c
    id: ssd1306_id
    model: "SSD1306_128x64"
    update_interval: 0.10s
    auto_clear_enabled: true
    contrast: 40%
    invert: false
    rotation: 270

# maybe a device info page 
          # auto ip_addr = id(ip_address_id)->get_state();
          # it.printf(width, ++line * char_height, tiny_font, TextAlign::BASELINE_RIGHT, "%s", App.get_name().c_str());
          # it.printf(width, ++line * char_height, tiny_font, TextAlign::BASELINE_RIGHT, "%s", ip_addr.c_str());

    lambda: |-
          static auto full_width = it.get_width();
          static const int yellow_width = 16; 
          static auto blue_width = full_width - yellow_width;
          static auto height = it.get_height();
          static auto tiny_font = id(tiny_font_id);
          static auto big_font = id(large_font_id);
          static auto small_font = id(small_font_id);
          static auto med_font = id(med_font_id);
          static const int tiny_char_height = 8;
          static const int small_char_height = 16;
          static const int med_char_height = 21;
          static const int big_char_height = 37;
          int yellow_line = 0;
          int blue_line = 0;

          static std::string device_name = App.get_name();
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "%.3s", device_name.c_str());

          std::string ip_addr = id(ip_address_id).get_state();
          //ESP_LOGD("steve", "text sensor %s", ip_addr.c_str()); 
          std::string last_octet = "---";
          std::string::size_type last_dot = ip_addr.rfind('.');
          if (last_dot != std::string::npos) 
          {
            last_octet = ip_addr.substr(last_dot + 1, 3);
          }
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "%s", last_octet.c_str());

          int ill = (int) id(illuminance_id)->state;
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "%3d", ill);

          // the encapsulation of data is ... not, as here we start to read all sorts of global data with 
          // 'well-known' names...

          bool radar_target0 = id(ld2410_0_target_detected);
          bool radar_target1 = id(ld2410_1_target_detected);

          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, 
            "R%s%s",
            radar_target0 ? "D" : "-",
            radar_target1 ? "D" : "-");

          auto key_states = id(keypad_key_states); 
          //for (int i = 0; i < 10; i += 2)
          //{
            // it.line(full_width - yellow_width, yellow_line + i, full_width, yellow_line + i, COLOR_ON);
            //it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT,
            //"%s %s",
            //key_states[i] ? std::to_string(i).c_str() : "-",
            //key_states[i+1] ? std::to_string(i+1).c_str() : "-");
          //}

          int x = blue_width;
          int y = yellow_line + 2;
          it.line(x, y, x + 2, y, key_states[0] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[1] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[2] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[3] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[0] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[1] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[2] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[3] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[0] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[1] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[2] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[3] ? COLOR_OFF : COLOR_ON);


          x = blue_width;
          y += 4;
          it.line(x, y, x + 2, y, key_states[4] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[6] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[8] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[4] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[6] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[8] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[4] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[6] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[8] ? COLOR_OFF : COLOR_ON);


          x = blue_width;
          y += 4;
          it.line(x, y, x + 2, y, key_states[5] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[7] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[9] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[5] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[7] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[9] ? COLOR_OFF : COLOR_ON);

          x = blue_width;
          y += 1;
          it.line(x, y, x + 2, y, key_states[5] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[7] ? COLOR_OFF : COLOR_ON);
          x += 4;
          it.line(x, y, x + 2, y, key_states[9] ? COLOR_OFF : COLOR_ON);

          // blinky routine as an array of connected points.
          static const int NUM_BLINKIES = 3;
          static const int MIN_X = full_width - yellow_width;
          static const int MAX_X = full_width - 1;
          static const int MIN_Y = y + 1;
          static const int MAX_Y = height - 35;
          static int blinky_x[] = {0, 30, 10, 75};
          static int blinky_y[] = {0, 5, 127, 30};
          static int blinky_dx[] = {1, 1, -2, -2};
          static int blinky_dy[] = {1, -2, 1, 1};
          for (int i = 0; i < NUM_BLINKIES; ++i) 
          {
            blinky_x[i] += blinky_dx[i];
            blinky_y[i] += blinky_dy[i];
            if (blinky_x[i] > MAX_X) { blinky_x[i] = MAX_X;  blinky_dx[i] = -blinky_dx[i]; }
            if (blinky_y[i] > MAX_Y) { blinky_y[i] = MAX_Y;  blinky_dy[i] = -blinky_dy[i]; }
            if (blinky_x[i] < MIN_X ) { blinky_x[i] = MIN_X; blinky_dx[i] = -blinky_dx[i]; }
            if (blinky_y[i] < MIN_Y ) { blinky_y[i] = MIN_Y; blinky_dy[i] = -blinky_dy[i]; }
          }
          for (int i = 0; i < NUM_BLINKIES; ++i)
          {
            if (NUM_BLINKIES - 1 == i) 
            {
              it.line(blinky_x[i], blinky_y[i], blinky_x[0], blinky_y[0], COLOR_ON);
              break;
            }
            it.line(blinky_x[i], blinky_y[i], blinky_x[i + 1], blinky_y[i + 1], COLOR_ON);
          
          //  it.draw_pixel_at(blinky_x[i], blinky_y[i], COLOR_ON);
          }

          // 
          // blue section
          // 

          // it.printf(blue_width, blue_line, tiny_font, TextAlign::BASELINE_RIGHT, "%s", App.get_name().c_str());

          float hum = 0.0;
          hum = id(humidity_id)->state;
          it.print(blue_width, blue_line += (tiny_char_height - 2), tiny_font, TextAlign::BASELINE_RIGHT, "Humidity");
          it.printf(blue_width, blue_line - 1, med_font, TextAlign::TOP_RIGHT, "%1d", (int)(hum * 10) % 10);
          it.printf(blue_width, blue_line += (big_char_height - 2), big_font, TextAlign::BASELINE_RIGHT, "%2d ", (int)hum);
          it.print(blue_width, blue_line, tiny_font, TextAlign::BOTTOM_RIGHT, "%");

          blue_line += 4;

          float temp = 0.0;
          temp = id(temperature_id)->state;
          it.print(blue_width, blue_line += tiny_char_height - 2, tiny_font, TextAlign::BASELINE_RIGHT, "Temp");
          it.printf(blue_width, blue_line, med_font, TextAlign::TOP_RIGHT, "%1d", (int)(temp * 10) % 10);
          it.printf(blue_width, blue_line += big_char_height -2, big_font, TextAlign::BASELINE_RIGHT, "%2d ", (int)temp);
          it.print(blue_width, blue_line, tiny_font, TextAlign::BOTTOM_RIGHT, "F");

          blue_line += tiny_char_height;

          // doors with locks can have states: open, closed+unlocked, closed+locked
          bool is_door_lock_0_sensor_opened = id(door_lock_0_sensor).state;
          bool is_door_lock_1_sensor_opened = id(door_lock_1_sensor).state;
          int door_lock_0_state = id(door_lock_0).state;
          int door_lock_1_state = id(door_lock_1).state;
          yellow_line = blue_line;
          it.print(blue_width, blue_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "Door 1");
          it.print(blue_width, blue_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "Door 2");
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, 
            "%s", is_door_lock_0_sensor_opened ? "OPN" : ( door_lock_0_state == 1 ? "LCK" : "CLS") );
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, 
            "%s", is_door_lock_1_sensor_opened ? "OPN" : ( door_lock_1_state == 1 ? "LCK" : "CLS") );

          // doors without locks can have states: open, closed.
          bool is_door_0_sensor_opened = id(door_sensor_0).state;
          bool is_door_1_sensor_opened = id(door_sensor_1).state;
          it.print(blue_width, blue_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "Door 3");
          it.print(blue_width, blue_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "Door 4");
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, 
            "%s", is_door_0_sensor_opened ? "OPN" : "CLS");
          it.printf(full_width, yellow_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, 
            "%s", is_door_1_sensor_opened ? "OPN" : "CLS");

          // it.print(blue_width, blue_line += tiny_char_height, tiny_font, TextAlign::BASELINE_RIGHT, "ARKADIA");









