substitutions:

# 10-key keypad using mcp23017 io expander
# https://esphome.io/components/mcp230xx.html#mcp230xx-i-o-expander

mcp23017:
  - id: 'mcp23017_0'
    address: 0x20
    # TODO need to experiment with this --> interrupt_pin: GPIO0

globals:
   - id: keypad_key_states
     type: int[10]
     restore_value: no


          # auto b = id(buzzer_0_id); 
          # b->turn_on();
          # b->set_frequency(10000.0);
          # b->set_level(0.5);
          # b->turn_off();

# # Example usage in an automation
# on_press:
#     then:
#     ######################################################
#     # Must be turned on before setting frequency & level
#     ######################################################
#     - output.turn_on: buzzer_0_id
#     ######################################################
#     # Frequency sets the wave size
#     ######################################################
#     - output.ledc.set_frequency:
#         id: buzzer_0_id
#         frequency: "1000Hz"
#     ######################################################
#     # level sets the %age time the PWM is on
#     ######################################################
#     - output.set_level:
#         id: buzzer_0_id
#         level: "50%"

# id(light_1).set_level(0.5);

binary_sensor:
  - platform: gpio
    name: "KSW 0"
    id: keypad_button_0
    pin:
      mcp23xxx: mcp23017_0
      number: 0
      inverted: true
      mode:
        input: true
        pullup: true
    on_state:
      then:
        lambda: |-
          id(keypad_key_states)[0] = x;    
    on_release:
      then:
        - rtttl.play: !lambda |-
            return "sw0:d=32,o=5,b=180:a4,a";
