packages:
  i2c: !include
    file: /workspace/include/i2c.yaml
    vars:
      i2c_sda_pin: "GPIO21"
      i2c_scl_pin: "GPIO18"
      i2c_freq: "256kHz"  # on this board, >= 258kHz will not work with the BMP280 module
  temp_humidity: !include
    file: ./BMP280-AHT20-temp-humidity.yaml
    vars: 
      temperature_offset: "0"      
  illuminance: !include
    file: ./photoresistor-illuminance.yaml
    vars:
      illuminance_pin: "GPIO2"

# "All Device" baseline stuff here

<<: !include 
  file: /workspace/include/lolin-s2-mini-wifi-baseline.yaml
  vars:
    logger_baud_rate: 115200
    device_friendly_name: "Env Sensor (${device_hostname})"
    device_comment: "Arkadia House Environmental Sensor."

