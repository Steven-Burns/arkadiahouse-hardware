substitutions:
  device_hostname: SPECIFY_HOSTNAME_WHEN_INCLUDING_BASELINE_YAML

packages:
  diagnostics: !include 
    file: /workspace/include/diagnostics.yaml
    vars:
      builtin_led_pin: "GPIO15"
  standard_device: !include
    file: /workspace/include/standard-home-assistant-device.yaml
  wifi: !include  
    file: /workspace/include/wifi.yaml
  i2c: !include
    file: /workspace/include/i2c.yaml
    vars:
      i2c_sda_pin: "GPIO21"
      i2c_scl_pin: "GPIO18"
      i2c_freq: "256kHz"  # on this board, >= 258kHz will not work with the BMP280 module
  temp_humidity: !include
    file: ./BMP280-AHT20-temp-humidity.yaml
    vars: 
      temperature_offset: "0"      
  illuminance: !include
    file: ./photoresistor-illuminance.yaml
    vars:
      illuminance_pin: "GPIO2"

esp32:
  board: lolin_s2_mini
  variant: ESP32S2
  cpu_frequency: 240MHZ
  toolchain: esp-idf  
  framework:
    type: esp-idf

esphome:
  name: ${device_hostname}
  friendly_name: "Env Sensor ${device_hostname[:3]}"
  comment: "Arkadia House Environmental Sensor."
  name_add_mac_suffix: false
  project:
    name: "ArkadiaHouse.EnvSensor"
    version: "1.4"

logger:
  level: DEBUG
  # baud_rate = 0 will disable serial logging (API access to logs should still work, tho)
  baud_rate: 115200
  logs:
    # turn the volume down on sensors as some are really noisy
    sensor: ERROR

        
