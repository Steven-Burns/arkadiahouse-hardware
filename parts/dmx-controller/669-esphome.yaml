light:
  - &light_defaults
    platform: rgbww
    name: "Light ${device_hostname[:3]}-U1-01"
    id: light_${device_hostname[:3]}_u1_01
    default_transition_length: 0s
    gamma_correct: 2.8
    disabled_by_default: false
    restore_mode: RESTORE_AND_OFF
    initial_state: 
      state: OFF
      color_mode: RGB_COLD_WARM_WHITE
    flash_transition_length: 0s
    constant_brightness: false
    color_interlock: false
    cold_white_color_temperature: 5700K
    warm_white_color_temperature: 3700K    
    red: dmx_u1_ch1
    green: dmx_u1_ch2
    blue: dmx_u1_ch3
    cold_white: dmx_u1_ch4
    warm_white: dmx_u1_ch5
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 4.5s
          update_interval: 5s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: Color Switcher
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              cold_white: 0%
              warm_white: 0%
              duration: 1250ms
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 100%
              blue: 0%
              cold_white: 0%
              warm_white: 0%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 0%
              blue: 100%
              cold_white: 0%
              warm_white: 0%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 0%
              blue: 0%
              cold_white: 100%
              warm_white: 0%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 0%
              blue: 0%
              cold_white: 0%
              warm_white: 100%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 100%
              green: 100%
              blue: 0%
              cold_white: 0%
              warm_white: 0%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 100%
              blue: 100%
              cold_white: 0%
              warm_white: 100%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 100%
              green: 0%
              blue: 100%
              cold_white: 0%
              warm_white: 100%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

            - state: true
              red: 0%
              green: 0%
              blue: 0%
              cold_white: 100%
              warm_white: 100%
              duration: 1250ms 
            # - state: true
            #   red: 0%
            #   green: 0%
            #   blue: 0%
            #   cold_white: 0%
            #   warm_white: 0%
            #   duration: 150ms

      - flicker:
      - random:
          transition_length: 1s
          update_interval: 2s
          name: Random
      - random:
          transition_length: 250ms
          update_interval: 1s
          name: Fast Random
      - random:
          transition_length: 100ms
          update_interval: 500ms
          name: Very Fast Random
      - lambda:
          name: Custom Effect 01
          update_interval: 6s
          lambda: |-
            static int state = 0;
            static float warm = 0.0;
            static float cold = 0.0;
            if (initial_run)
            {
              state = 0;
            }
            auto call = it.turn_on();
            call.set_transition_length(4000);
            switch (state) {
              case 0:
                call.set_rgb(0, 0, 0);
                break;
              case 1:
                call.set_rgb(1.0, 0.0, 0.0);
                break;
              case 2:
                call.set_rgb(0.0, 1.0, 0.0);
                break;
              case 3:
                call.set_rgb(0.0, 0.0, 1.0);
                break;
              case 4:
                call.set_rgb(1.0, 1.0, 0.0);
                break;
              case 5:
                call.set_rgb(1.0, 0.0, 1.0);
                break;
              case 6:
                call.set_rgb(0.0, 1.0, 1.0);
                break;
              default:
                call.set_rgb(1.0, 0.0, 0.0);
            }
            call.set_warm_white(warm);
            call.set_cold_white(cold);
            call.perform();
            state++;
            warm += 0.1;
            cold += 0.1;
            if (state > 6)
            {
              state = 0;
            }
            if (warm > 1.0)
            {
              warm = 0.0;
            }
            if (cold > 1.0)
            {
              cold = 0.0;
            }

