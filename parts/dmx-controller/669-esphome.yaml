light:
  - &light_defaults
    platform: rgbww
    name: "Light ${device_hostname[:3]}-U1-01"
    id: light_${device_hostname[:3]}_u1_01
    default_transition_length: 0s
    gamma_correct: 1.0
    disabled_by_default: false
    restore_mode: ALWAYS_OFF
    flash_transition_length: 0s
    constant_brightness: false
    color_interlock: false
    cold_white_color_temperature: 5700K
    warm_white_color_temperature: 3700K    
    red: dmx_u1_ch1
    green: dmx_u1_ch2
    blue: dmx_u1_ch3
    cold_white: dmx_u1_ch4
    warm_white: dmx_u1_ch5
    effects:
      - strobe:
          colors:
            - state: true
              duration: 500ms
              brightness: 1.0
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
            - state: false
              duration: 500ms
              brightness: 1.0
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
          name: Strobe
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 5s
          update_interval: 10s
      - pulse:
          name: "Asymmetrical Pulse"
          transition_length:
            on_length: 1s
            off_length: 500ms
          update_interval: 1.5s      
      - random:
          transition_length: 3s
          update_interval: 7s
          name: Random
      - flicker:
          alpha: 0.95
          intensity: 0.015
          name: Flicker
      - lambda:
          name: Custom Effect 01
          update_interval: 6s
          lambda: |-
            static int state = 0;
            static float warm = 0.0;
            static float cold = 0.0;
            if (initial_run)
            {
              state = 0;
            }
            auto call = it.turn_on();
            call.set_transition_length(4000);
            switch (state) {
              case 0:
                call.set_rgb(0, 0, 0);
                break;
              case 1:
                call.set_rgb(1.0, 0.0, 0.0);
                break;
              case 2:
                call.set_rgb(0.0, 1.0, 0.0);
                break;
              case 3:
                call.set_rgb(0.0, 0.0, 1.0);
                break;
              case 4:
                call.set_rgb(1.0, 1.0, 0.0);
                break;
              case 5:
                call.set_rgb(1.0, 0.0, 1.0);
                break;
              case 6:
                call.set_rgb(0.0, 1.0, 1.0);
                break;
              default:
                call.set_rgb(1.0, 0.0, 0.0);
            }
            call.set_warm_white(warm);
            call.set_cold_white(cold);
            call.perform();
            state++;
            warm += 0.1;
            cold += 0.1;
            if (state > 6)
            {
              state = 0;
            }
            if (warm > 1.0)
            {
              warm = 0.0;
            }
            if (cold > 1.0)
            {
              cold = 0.0;
            }

