light:
  - &light_defaults
    platform: rgbww
    name: "Light ${device_hostname[:3]}-U1-11"
    id: light_${device_hostname[:3]}_u1_11
    default_transition_length: 0s
    gamma_correct: 1.0
    disabled_by_default: false
    restore_mode: ALWAYS_OFF
    flash_transition_length: 0s
    constant_brightness: false
    color_interlock: false
    #cold_white_color_temperature: 5700 K
    #warm_white_color_temperature: 3700 K    
    red: dmx_u1_ch51
    green: dmx_u1_ch52
    blue: dmx_u1_ch53
    cold_white: dmx_u1_ch54
    warm_white: dmx_u1_ch55
    effects:
      - strobe:
          colors:
            - state: true
              duration: 500ms
              brightness: 1.0
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
            - state: false
              duration: 500ms
              brightness: 1.0
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
          name: Strobe
      - pulse:
          transition_length: 1s
          update_interval: 1s
          min_brightness: 0.0
          max_brightness: 1.0
          name: Pulse
      - random:
          transition_length: 7500ms
          update_interval: 10s
          name: Random
      - flicker:
          alpha: 0.95
          intensity: 0.015
          name: Flicker

  - <<: *light_defaults
    name: "Light ${device_hostname[:3]}-U1-12"
    id: light_${device_hostname[:3]}_u1_12
    red: dmx_u1_ch56
    green: dmx_u1_ch57
    blue: dmx_u1_ch58
    cold_white: dmx_u1_ch59
    warm_white: dmx_u1_ch60
  - <<: *light_defaults
    name: "Light ${device_hostname[:3]}-U1-13"
    id: light_${device_hostname[:3]}_u1_13 
    red: dmx_u1_ch61
    green: dmx_u1_ch62
    blue: dmx_u1_ch63
    cold_white: dmx_u1_ch64
    warm_white: dmx_u1_ch65
  - <<: *light_defaults
    name: "Light ${device_hostname[:3]}-U1-14"
    id: light_${device_hostname[:3]}_u1_14
    red: dmx_u1_ch66
    green: dmx_u1_ch67
    blue: dmx_u1_ch68
    cold_white: dmx_u1_ch69
    warm_white: dmx_u1_ch70
  - <<: *light_defaults
    name: "Light ${device_hostname[:3]}-U1-15"
    id: light_${device_hostname[:3]}_u1_15
    red: dmx_u1_ch71
    green: dmx_u1_ch72
    blue: dmx_u1_ch73
    cold_white: dmx_u1_ch74
    warm_white: dmx_u1_ch75
