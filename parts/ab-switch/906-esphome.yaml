esp32:
  board: nodemcu-32s
  cpu_frequency: 240MHZ
  toolchain: esp-idf  
  framework:
    type: esp-idf

packages:
  diagnostics: !include 
    file: /workspace/include/diagnostics.yaml
  wifi: !include  
    file: /workspace/include/wifi.yaml

switch:
  - platform: gpio
    name: "Relay A-B"
    id: relay_0_id
    pin: 
      number: 13
      inverted: false
      mode:
        output: true
        pulldown: true

# "All Device" baseline stuff here

<<: !include 
  file: /workspace/include/esp32-device-baseline.yaml
  vars:
    device_friendly_name: "A-B switch on board 906."
    device_comment: "A-B selector for stereo speaker output."

